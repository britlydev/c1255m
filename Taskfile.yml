# Taskfile
version: '3'

dotenv: ['.env']

vars:
  LOCAL_BIN: './bin'
  GOLANGCI_VERSION: v2.15.0
  PKG: github.com/britlydev/c1255m/internal/version

tasks:
  info:
    cmds:
      - task --list
    silent: true

  install-golangci-lint:
    desc: Install golangci-lint into ./bin
    status:
      - test -x {{.LOCAL_BIN}}/golangci-lint{{exeExt}}
      - '{{.LOCAL_BIN}}/golangci-lint{{exeExt}} version | grep -q {{trimPrefix "v" .GOLANGCI_VERSION}}'
    cmds:
      - GOBIN="$(pwd)/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_VERSION}}

  lint:
    desc: Run linters
    deps: [install-golangci-lint]
    cmds:
      - '{{.LOCAL_BIN}}/golangci-lint{{exeExt}} run ./...'

  lint-fix:
    desc: Run linters with autofix
    deps: [install-golangci-lint]
    cmds:
      - '{{.LOCAL_BIN}}/golangci-lint{{exeExt}} run ./... --fix'

  test:
    desc: Run all tests
    cmds:
      - go test ./... -cover

  build:
    desc: Build every service into ./bin
    deps: [build-api]

  build-api:
    desc: Build API
    vars:
      VERSION:
        sh: git describe --tags --always --dirty
      COMMIT:
        sh: git rev-parse --short HEAD
      DATE:
        sh: date -u +%Y-%m-%dT%H:%M:%SZ
    env:
      CGO_ENABLED: '0'
    cmds:
      - go build -ldflags "-s -w -X {{.PKG}}.Version={{.VERSION}} -X {{.PKG}}.Commit={{.COMMIT}} -X {{.PKG}}.Date={{.DATE}}" -o {{.LOCAL_BIN}}/api{{exeExt}} ./cmd/api

  # openapi
  get-openapi:
    cmds:
      - go get -tool github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@latest
      - go get github.com/oapi-codegen/runtime@latest

  generate:openapi:
    cmds:
      - go generate ./internal/transport/httpapi/oapi/...
